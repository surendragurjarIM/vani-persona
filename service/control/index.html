<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* One quiet page: a slim top bar with four views; each view leads with one thing and hides detail behind a click. */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#141922; --muted:#667085; --faint:#98A2B3; --line:#E4E7EC;
  --accent:#1F6F5C; --accent-soft:#E3F1EC; --warm:#B4621A; --warm-soft:#FBEEE0;
  --good:#1F8A4C; --mid:#B7791F; --low:#98A2B3; --bad:#C2413B; --bad-soft:#FCE8E6;
  --display:"Bricolage Grotesque",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1318; --card:#171C23; --ink:#E9EDF2; --muted:#9AA4B2; --faint:#6B7480; --line:#252C36;
  --accent:#5CC4A6; --accent-soft:#16302A; --warm:#E9A25A; --warm-soft:#2E2113;
  --good:#5BC985; --mid:#E3B062; --low:#6B7480; --bad:#F08A83; --bad-soft:#3A1A18; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font:700 20px var(--display);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);padding:6px 16px;border-radius:999px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.top .meta{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px;display:flex;flex-direction:column;gap:22px}
h1{font:700 clamp(26px,3.4vw,34px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 18px var(--display);margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.label{font:500 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
button.pill:hover{border-color:var(--accent)}
button.pill.on{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{font:13px/1.5 var(--mono);min-height:150px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
pre{font:12px/1.5 var(--mono);background:var(--bg);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;max-height:380px;overflow:auto}
/* Talk view */
.talk{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.talk{grid-template-columns:1fr}}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;color:var(--ink)}
.hit:hover{background:var(--bg)}
.persona-head{display:flex;flex-direction:column;gap:8px}
.persona-head .who{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font:600 17px var(--display);overflow-wrap:anywhere}
.tile .r{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile:hover .r{-webkit-line-clamp:unset}
.conf{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:1px}
.conf.high{background:var(--good)} .conf.medium{background:var(--mid)} .conf.low{background:var(--low)}
.call{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.agent{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 18px var(--display)}
.status{font-size:13px;color:var(--muted)}
.bubbles{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;min-height:120px}
.b{padding:8px 12px;border-radius:14px;max-width:88%;font-size:14px}
.b.bot{background:var(--accent-soft);align-self:flex-start;border-bottom-left-radius:4px}
.b.user{background:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.hint{font-size:12.5px;color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:40px 10px}
/* Shared */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:14px}
.track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.track i.alt{background:var(--warm)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);font-size:13px}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .vs{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.tag.strong{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.tag.moderate{color:var(--mid);background:color-mix(in srgb,var(--mid) 16%,transparent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .n{font:600 12px var(--mono);color:var(--faint)}
.step .t{font:600 15px var(--display)}
.step .w{font-size:12.5px;color:var(--muted)}
.step .s{font-size:12px}
.step .s.ok{color:var(--good)} .step .s.no{color:var(--mid)}
.step.sarvam{background:var(--warm-soft);border-color:transparent}
.job{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.st{font-size:12.5px}
.st.running{color:var(--accent)} .st.done{color:var(--good)} .st.failed{color:var(--bad)} .st.idle{color:var(--faint)}
.turn{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:14px}
.turn:first-child{border-top:0}
.sw{color:var(--warm);font-weight:600}
.li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.li:first-child{border-top:0}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:10;overflow:auto}
.modal.on{display:flex}
.modal .card{max-width:820px;width:100%}
.guide h1{font-size:26px} .guide h2{font-size:19px;margin-top:22px} .guide code{font-family:var(--mono);font-size:.9em;background:var(--bg);padding:1px 5px;border-radius:5px}
.guide table{border-collapse:collapse;font-size:13.5px} .guide td,.guide th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
@media (prefers-reduced-motion: no-preference){.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand">VANI<span>.</span></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-v="talk">Talk</button><button data-v="evidence">Evidence</button><button data-v="pipeline">Pipeline</button><button data-v="feedback">Feedback</button>
  </nav>
  <div class="meta"><span id="health"></span><a href="#" id="openGuide">Guide</a><a href="/docs" target="_blank">API</a></div>
</div></div>
<main id="main"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card guide" id="modalBody"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-IN");
const pct = x => x == null ? "–" : Math.round(x*100) + "%";
const ago = iso => { if(!iso) return ""; const s=(Date.now()-new Date(iso))/1000; return s<3600? Math.max(1,Math.round(s/60))+" min ago" : s<86400? Math.round(s/3600)+" h ago" : Math.round(s/86400)+" d ago"; };
async function api(p, o){ const r = await fetch(p, o); const t = await r.text(); let j; try{ j = JSON.parse(t) }catch{ j = t } if(!r.ok) throw new Error((j && j.detail) || r.status); return j; }
const post = (p, b) => api(p, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b||{})});
const S = {view:"talk", seller:null, cfg:null, route:null, agent:null};

function go(v){ S.view = v; try{ history.replaceState(null,"","#"+v) }catch{}
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); render(); }
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => go(b.dataset.v));
async function render(){ const m = $("#main"); m.classList.remove("fade"); void m.offsetWidth; m.classList.add("fade");
  try{ await V[S.view](m) }catch(e){ m.innerHTML = `<div class="card"><h2>This view couldn't load</h2><p class="muted">${esc(e.message)}. Is the service window still open?</p></div>` } }

// The six settings that make two personas sound different, shown as tiles.
const TILES = [
  ["Voice", s => { const n = s.voice.speaker.value.split("_")[0]; return `${n[0].toUpperCase()}${n.slice(1)} · ${s.voice.gender.value}` }, s => s.voice.speaker],
  ["Pace", s => s.voice.pace.value + "×", s => s.voice.pace],
  ["Language", s => `${s.language.primary.value} · ${s.language.english_share.value}% English`, s => s.language.english_share],
  ["Register", s => s.language.address_form.value, s => s.language.formality],
  ["Opening", s => s.conversation_plan.opening_style.value.replace(/_/g," "), s => s.conversation_plan.opening_style],
  ["Turn length", s => `≤ ${s.tone.max_words_per_turn.value} words`, s => s.tone.max_words_per_turn],
];

const V = {
async talk(m){
  if(!S.cfg) S.cfg = await api("/api/console/config");
  m.innerHTML = `
  <div><h1>Who should VANI be for this seller?</h1><p class="sub">Pick a seller. Their persona is built from their own data and past calls, then you can talk to the matching agent live on Sarvam.</p></div>
  <div class="talk">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <input id="q" placeholder="Search 1,49,363 sellers by id, city or product" autocomplete="off">
        <div class="row" id="demo">${S.cfg.demo_sellers.map(d => `<button class="pill ${String(d.seller_id)===String(S.seller)?"on":""}" data-id="${d.seller_id}" title="Seller ${d.seller_id}">${esc(d.note.replace(", ", " · "))}</button>`).join("")}</div>
        <div class="hits" id="hits"></div>
      </div>
      <div id="persona">${S.seller ? "" : `<div class="card empty">Choose a seller above to see their persona.</div>`}</div>
    </div>
    <div class="card call">
      <div class="agent"><div class="avatar" id="av">V</div><div><b id="aname">No seller chosen</b><div class="status" id="astatus">${S.cfg.voice_ready ? "Voice ready" : "Voice off: add SARVAM_VA_API_KEY to .env"}</div></div></div>
      <div class="row"><button class="btn" id="talkBtn" disabled>Talk to VANI</button><button class="btn ghost" id="endBtn" disabled>End</button></div>
      <div class="bubbles" id="bubbles"><div class="hint">Try being busy, getting annoyed, asking "who is this?", or switching to English, Gujarati or Tamil. VANI changes how it speaks on the next turn.</div></div>
    </div>
  </div>`;
  m.querySelectorAll("#demo .pill").forEach(b => b.onclick = () => pick(b.dataset.id));
  let t; $("#q").oninput = () => { clearTimeout(t); const q = $("#q").value.trim(); if(q.length < 2){ $("#hits").innerHTML = ""; return }
    t = setTimeout(async () => { const rows = await api("/api/sellers/search?q=" + encodeURIComponent(q));
      $("#hits").innerHTML = rows.slice(0,8).map(r => `<button class="hit" data-id="${r.fk_glusr_usr_id}"><b class="mono">${r.fk_glusr_usr_id}</b> <span class="muted small">${esc([r.seller_city, r.top_category_1, r.annual_turnover].filter(Boolean).join(" · "))}</span></button>`).join("") || `<span class="muted small">No match</span>`;
      $("#hits").querySelectorAll(".hit").forEach(h => h.onclick = () => { $("#hits").innerHTML = ""; $("#q").value = ""; pick(h.dataset.id) }); }, 250); };
  $("#talkBtn").onclick = talk; $("#endBtn").onclick = endCall;
  if(S.seller) pick(S.seller);
},

async evidence(m){
  const [e, s] = await Promise.all([api("/api/control/evidence"), api("/api/control/signals")]);
  const strong = e.records.filter(r => r.usable && r.rate_a != null && (r.strength === "strong" || r.strength === "moderate")).sort((a,b) => Math.abs(b.diff_pp||0) - Math.abs(a.diff_pp||0));
  const T = s.switch_timing && s.switch_timing.with_llm_guess;
  m.innerHTML = `
  <div><h1>What past calls prove</h1><p class="sub">${fmt(e.records.length)} comparisons from 2,69,455 real VANI calls. Baseline: ${pct(e.baseline_mf)} of answered calls fix a meeting. Every persona rule cites one of these.</p></div>
  <div class="two">
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Strongest findings</h2><input id="eq" placeholder="Filter" style="max-width:180px;padding:7px 12px"></div>
      <div id="evl" style="margin-top:8px"></div>
      <details style="margin-top:10px"><summary>How strength is decided</summary><pre>${esc(e.strength_rules)}</pre></details></div>
    <div style="display:flex;flex-direction:column;gap:22px">
      ${T ? `<div class="card"><h2>Switches on the right turn</h2><p class="muted small">The live switch tool replayed on ${fmt(T.calls)} audited calls. Zero flapping.</p>
        <div class="bars" style="margin-top:10px">${["frustration","rush","confusion","interest"].map(k => `<div class="bar"><span>${k}</span><div class="track"><i style="width:${(T.by_signal[k].on_time_rate||0)*100}%"></i></div><span class="num">${pct(T.by_signal[k].on_time_rate)}</span></div>`).join("")}</div></div>` : ""}
      <div class="card"><h2>Try the switch tool</h2><p class="muted small">One seller reply per line. Prefix a line with a signal and a colon (<span class="mono">confusion: …</span>) to stand in for the LLM's guess. Hindi in Devanagari works too.</p>
        <textarea id="lines">kya bola? samjha nahi
अभी बहुत बिजी हूँ, जल्दी बोलिए
aap log baar baar call karte ho
kitne ka hai plan?</textarea>
        <div class="row" style="margin-top:10px"><button class="btn" id="run">Run</button></div><div id="out" style="margin-top:8px"></div></div>
    </div>
  </div>`;
  const draw = () => { const q = $("#eq").value.toLowerCase();
    $("#evl").innerHTML = strong.filter(r => !q || (r.claim + r.choice_a + r.choice_b).toLowerCase().includes(q)).slice(0, 14).map(r => `
      <div class="ev"><div>${esc(r.claim)} <span class="tag ${r.strength}">${r.strength}</span><div class="muted small">${esc(r.choice_a)} vs ${esc(r.choice_b)} · <span class="mono">${esc(r.id)}</span></div></div>
      <div class="vs">${pct(r.rate_a)} <span class="muted">vs</span> ${pct(r.rate_b)}</div></div>`).join("") || `<p class="muted">No match.</p>`; };
  $("#eq").oninput = draw; draw();
  $("#run").onclick = async () => { const r = await post("/api/control/detect", {lines: $("#lines").value.split("\n")});
    $("#out").innerHTML = r.turns.map(t => `<div class="turn"><span class="mono small">${esc(t.words)}</span>
      ${t.switches.length ? t.switches.map(x => `<span class="sw">→ ${esc(x.to)} <span class="muted small">(${esc(x.source)})</span></span>`).join("") : `<span class="muted small">no change · stays ${esc(t.mode)}</span>`}</div>`).join(""); };
},

async pipeline(m){
  const [o, r, j] = await Promise.all([api("/api/control/overview"), api("/api/control/routing"), api("/api/control/jobs")]);
  const n = o.numbers, st = Object.fromEntries(o.steps.map(x => [x.n, x]));
  const step = (k, t, w, sarvam) => { const x = st[k]; const f = x && x.outputs[0];
    return `<div class="step ${sarvam?"sarvam":""}"><span class="n">${sarvam?"on Sarvam":"step "+k}</span><span class="t">${t}</span><span class="w">${w}</span>
      ${sarvam ? `<span class="s ok">live</span>` : f && f.exists ? `<span class="s ok">updated ${ago(f.modified)}</span>` : `<span class="s no">not run yet</span>`}</div>`; };
  const total = Object.values(r.by_agent).reduce((a,b)=>a+b,0);
  const running = Object.values(j).some(x => x.status === "running");
  m.innerHTML = `
  <div><h1>How a persona gets to a call</h1><p class="sub">Steps 1 to 4 run here every night. Sarvam runs the call and the live switch. Results come back for the next night.</p></div>
  <div class="flow">
    ${step(1,"Evidence","Meeting-fix rate per choice, with confidence")}
    ${step(2,"Detector","Keywords + LLM checked on audited turns")}
    ${step(3,"Personas",fmt(n.sellers)+" sellers, "+fmt(n.distinct_personas)+" distinct")}
    ${step(4,"Routing","1 of 6 agents + 17 variables")}
    ${step(0,"Call","Voice, live switch, language", true)}
    ${step(11,"Results","Outcomes back, review queue")}
  </div>
  <div class="two">
    <div class="card"><h2>Where sellers go</h2><p class="muted small">Voice and pace live in the Sarvam agent, so sellers who should sound different go to different agents.</p>
      <div class="bars" style="margin-top:12px">${Object.entries(r.by_agent).map(([k,v]) => `<div class="bar"><span>${k==="do_not_call"?"do not call":esc(k.replace(/_/g," "))}</span><div class="track"><i class="${k==="do_not_call"?"alt":""}" style="width:${v/total*100}%"></i></div><span class="num">${fmt(v)}</span></div>`).join("")}</div></div>
    <div class="card"><h2>Run</h2><p class="muted small">One job at a time. New personas show as soon as nightly or manual-ingest finishes.</p>
      <div style="margin-top:6px">${Object.entries(j).filter(([k]) => k!=="tests").map(([k,x]) => `
        <div class="job"><b class="mono small">${k}</b><span class="st ${x.status}">${x.status==="idle"?"not run this session":x.status}${x.seconds!=null?" · "+x.seconds+"s":""}</span>
          <button class="btn ghost" data-j="${k}" ${running?"disabled":""} style="padding:6px 14px">Run</button></div>`).join("")}</div>
      ${Object.entries(j).filter(([,x]) => x.log_tail).map(([k,x]) => `<details><summary>${k} log</summary><pre>${esc(x.log_tail.slice(-2500))}</pre></details>`).join("")}</div>
  </div>
  <details class="card"><summary>Sarvam agents and settings</summary>
    <div style="margin-top:8px">${o.agents.map(a => `<div class="li"><b>${esc(a.name)} <span class="muted small">v${a.committed_version}</span></b><span class="muted small">${esc(a.voice)} · pace ${a.pace} · demo seller ${a.demo_seller}</span></div>`).join("")}</div>
    <p class="small muted">Sarvam key ${o.settings.sarvam_key_set?"set":"missing"} · telephony ${o.settings.telephony_set?"set":"not set (campaigns can't dial yet)"} · public address ${o.settings.public_url?esc(o.settings.public_url):"none (running locally)"}</p></details>`;
  m.querySelectorAll("button[data-j]").forEach(b => b.onclick = async () => { try{ await post("/api/control/jobs/"+b.dataset.j) }catch(e){} render() });
  if(running) setTimeout(() => S.view === "pipeline" && render(), 3000);
},

async feedback(m){
  const [r, man] = await Promise.all([api("/api/control/results"), api("/api/control/manual")]);
  m.innerHTML = `
  <div><h1>What came back from calls</h1><p class="sub">Finished calls land here. The ones a person should hear go to the review queue. Corrections you add below outrank every automatic rule.</p></div>
  <div class="two">
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Latest calls</h2><button class="btn ghost" id="smp" style="padding:6px 14px">Add a sample call</button></div>
      <div style="margin-top:6px">${r.results.length ? r.results.slice(0,8).map(x => `<div class="li"><b>${esc(x.call_outcome || "no outcome")} <span class="muted small">· seller ${esc(x.seller_id)} · ${ago(x.received_at)}</span></b>
        <span class="small">${x.live_switch_log ? esc(JSON.parse(x.live_switch_log).map(s => s.signal).join(" → ")) : `<span class="muted">no switches</span>`}${x.meeting_slot ? ` · <span class="muted">${esc(x.meeting_slot)}</span>` : ""}</span></div>`).join("")
        : `<p class="muted small">None yet. Real calls arrive once this service has a public address; until then they're on the Sarvam board. Add a sample to see the loop.</p>`}</div>
      ${r.results.some(x => String(x.attempt_id).startsWith("sample-")) ? `<button class="btn ghost" id="clr" style="padding:6px 14px;margin-top:10px">Remove samples</button>` : ""}</div>
    <div class="card"><h2>Review queue</h2>
      <div style="margin-top:6px">${r.review_queue.length ? r.review_queue.slice(-8).reverse().map(q => `<div class="li"><b class="small">${esc(q.notes)}</b><span class="muted small">seller ${esc(q.fk_glusr_usr_id)} · ${esc(q.signal)} · ${esc(q.call_outcome)}</span></div>`).join("") : `<p class="muted small">Nothing to review.</p>`}</div></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Your corrections</h2><span class="muted small">${man.overrides.length} active</span></div>
    <p class="muted small">One row changes one persona setting for a seller, a segment or everyone. Save, then run <b>manual-ingest</b> on Pipeline.</p>
    <textarea id="gaps">${esc(man.inbox_gaps || man.template_gaps || "")}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="save">Save</button><span id="sv" class="small"></span></div></div>`;
  $("#smp").onclick = async () => { await post("/api/control/results/sample"); render() };
  const c = $("#clr"); if(c) c.onclick = async () => { await api("/api/control/results/sample", {method:"DELETE"}); render() };
  $("#save").onclick = async () => { try{ const x = await post("/api/control/manual/gaps", {csv: $("#gaps").value}); $("#sv").innerHTML = `<span style="color:var(--good)">Saved ${x.saved_rows} rows.</span> Now run manual-ingest.` }catch(e){ $("#sv").innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>` } };
},
};

async function pick(id){
  S.seller = id;
  document.querySelectorAll("#demo .pill").forEach(b => b.classList.toggle("on", b.dataset.id === String(id)));
  const box = $("#persona"); if(!box) return;
  box.innerHTML = `<div class="card empty">Building persona…</div>`;
  const [s, r] = await Promise.all([api("/persona/"+id), api("/route/"+id)]); S.route = r;
  const snap = s.seller_snapshot;
  box.innerHTML = `<div class="card fade" style="display:flex;flex-direction:column;gap:16px">
    <div class="persona-head"><span class="label">Persona · seller ${esc(id)}</span><h1 style="font-size:26px">${esc(s.persona_label)}</h1>
      <span class="who">${esc([snap.seller_city, snap.top_category_1, snap.annual_turnover, snap.business_type].filter(Boolean).join(" · "))} · called ${esc(snap.bot_attempts)} times before</span>
      <div class="row"><span class="pill">→ ${esc(r.agent_name)}</span><span class="pill">starts in ${esc(r.initial_language)}</span>${r.do_not_call?`<span class="pill" style="color:var(--bad)">do not call</span>`:""}</div></div>
    <div class="tiles">${TILES.map(([k, val, src]) => { const x = src(s); return `<div class="tile"><span class="label">${k}<span class="conf ${esc(x.confidence)}" title="${esc(x.confidence)} confidence"></span></span><span class="v">${esc(val(s))}</span><span class="r">${esc(x.reason)}</span></div>` }).join("")}</div>
    <div class="tile" style="background:var(--warm-soft)"><span class="label">If the seller…</span><span class="small">${esc(s.conversation_plan.objection_playbook.value.slice(0,3).map(p => p.situation.replace(/_/g," ")).join(" · "))}: handled in this order. Best time to call ${esc(s.conversation_plan.best_call_window.value)}.</span></div>
    <details><summary>Every setting, reason and evidence</summary><pre>${esc(["voice","language","tone","conversation_plan","live_adaptation"].map(sec => Object.entries(s[sec]).map(([k,x]) => `${sec}.${k} = ${typeof x.value==="object"?JSON.stringify(x.value).slice(0,160):x.value}\n   ${x.reason}  [${(x.evidence||[]).join(", ")} · ${x.confidence} · ${x.source}]`).join("\n")).join("\n\n"))}</pre></details>
    <details><summary>What Sarvam receives (17 variables)</summary><pre>${esc(JSON.stringify(r.variables, null, 1))}</pre></details></div>`;
  $("#aname").textContent = r.agent_name; $("#av").textContent = (r.variables.agent_name || "V")[0];
  $("#talkBtn").disabled = !S.cfg.voice_ready || r.do_not_call;
}

function bubble(role, text){ const b = $("#bubbles"); if(!b) return; if(b.querySelector(".hint")) b.innerHTML = "";
  const d = document.createElement("div"); d.className = "b " + role; d.textContent = text; b.appendChild(d); d.scrollIntoView({block:"end"}); }
async function talk(){
  const { ConversationAgent, BrowserAudioInterface, InteractionType } = await import("https://cdn.jsdelivr.net/npm/sarvam-conv-ai-sdk@0.0.42/dist/browser.js/+esm");
  const r = S.route; $("#bubbles").innerHTML = "";
  S.agent = new ConversationAgent({
    apiKey: "server-side", baseUrl: `${location.origin}/sarvam-runtime/`,   // the real key is added on the server
    config: { org_id: S.cfg.org_id, workspace_id: S.cfg.workspace_id, app_id: r.app_id, version: r.app_version,
      user_identifier: `seller-${r.seller_id}`, user_identifier_type: "custom", interaction_type: InteractionType.CALL,
      input_sample_rate: 16000, output_sample_rate: 16000, agent_variables: r.variables, initial_language_name: r.initial_language },
    audioInterface: new BrowserAudioInterface(),
    transcriptCallback: async m => bubble(String(m.role).toLowerCase().includes("user") ? "user" : "bot", m.content),
    stateCallback: s => { $("#astatus").textContent = String(s).toLowerCase() },
    endCallback: async () => { $("#astatus").textContent = "Call ended · full trace in Sarvam Call Logs"; $("#endBtn").disabled = true; $("#talkBtn").disabled = false },
  });
  $("#talkBtn").disabled = true; $("#endBtn").disabled = false; $("#astatus").textContent = "connecting…";
  try{ await S.agent.start(); await S.agent.waitForConnect(15) }
  catch(e){ $("#astatus").textContent = "Couldn't connect: " + e.message; $("#talkBtn").disabled = false; $("#endBtn").disabled = true }
}
async function endCall(){ try{ await S.agent?.stop?.() }catch{} $("#endBtn").disabled = true; $("#talkBtn").disabled = false }

$("#openGuide").onclick = async ev => { ev.preventDefault(); const md = await api("/guide");
  $("#modalBody").innerHTML = `<div class="row" style="justify-content:flex-end"><button class="btn ghost" id="closeM" style="padding:6px 14px">Close</button></div>${window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`}`;
  $("#modal").classList.add("on"); $("#closeM").onclick = () => $("#modal").classList.remove("on"); };
$("#modal").onclick = e => { if(e.target.id === "modal") $("#modal").classList.remove("on") };
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#modal").classList.remove("on") });

api("/health").then(h => { $("#health").innerHTML = `<span class="dot ${h.sarvam_key_set?"":"off"}"></span>${h.sarvam_key_set ? "Connected to Sarvam" : "Sarvam key missing"}` }).catch(() => {});
const start = (location.hash || "").slice(1); go(V[start] ? start : "talk");
</script>
